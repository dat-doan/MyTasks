name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Generate native Android project
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # 7. Attach custom signing configuration
      - name: Configure Android signing
        run: |
          printf '\napply from: rootProject.file("../ci/android-signing.gradle")\n' \
            >> android/app/build.gradle

      # 8. Setup Gradle + caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 9. Restore Keystore from GitHub Secrets
      - name: Restore Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/android-upload.jks"

      # 10. Build signed release APK
      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      # 11. Upload APK to GitHub Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
