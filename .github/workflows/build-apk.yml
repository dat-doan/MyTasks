name: Build Android APK

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  queue: max
  cancel-in-progress: false

jobs:
  build-apk:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Bump build version
      - name: Bump and commit app version
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          message="chore: bump app version for PR #${PR_NUMBER}"

          existing="$(git log -1 --format=%H --grep="^${message}$")"

          if [ -n "$existing" ]; then
            echo "Version was already bumped for PR #${PR_NUMBER}"
            exit 0
          fi

          node scripts/bump-version.cjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.json
          git commit -m "$message"
          git push origin HEAD:main

      # 7. Generate native Android project
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # 8. Attach custom signing configuration
      - name: Configure Android signing
        run: |
          printf '\napply from: rootProject.file("../ci/android-signing.gradle")\n' \
            >> android/app/build.gradle

      # 9. Setup Gradle + caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 10. Restore Keystore from GitHub Secrets
      - name: Restore Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/android-upload.jks"

      # 11. Build signed release APK
      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      # 12. Upload APK to GitHub Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 10
